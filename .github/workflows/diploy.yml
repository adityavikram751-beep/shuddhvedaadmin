name: Deploy Shuddhveda Admin

on:
  push:
    branches:
      - master

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shuddhveda-admin-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          timeout: 30s
          command_timeout: 15m

          script: |
            set -e

            cd /var/www/shuddhvedaadmin

            echo "Pulling latest code..."
            git fetch origin master
            git reset --hard origin/master

            echo "Installing dependencies..."
            npm ci

            echo "Building Next.js..."
            npm run build

            echo "Restarting application..."
            if pm2 describe svhadmin >/dev/null 2>&1; then
              pm2 restart svhadmin --update-env
            else
              pm2 start npm --name svhadmin -- start
            fi

            pm2 save

            echo "Checking application..."
            for i in $(seq 1 15); do
              if curl --fail --silent http://127.0.0.1:3051/ -o /dev/null; then
                echo "Deployment successful!"
                exit 0
              fi
              echo "Waiting for app... ($i/15)"
              sleep 3
            done

            echo "App did not start. Last logs:"
            pm2 logs svhadmin --lines 30 --nostream
            exit 1